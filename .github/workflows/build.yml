name: Build

# Every push and pull request is compiled on Windows.
# Releases: when main contains a version (AssemblyVersion in src/Program.cs) that has no release yet,
# this workflow tags it (v1.2.3) and publishes a GitHub release with TSLauncher.zip attached.
# Pushing a v* tag by hand also publishes that tag.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $m = Select-String -Path src/Program.cs -Pattern 'AssemblyVersion\("(\d+)\.(\d+)\.(\d+)(?:\.(\d+))?'
          $g = $m.Matches[0].Groups
          $v = "$($g[1].Value).$($g[2].Value).$($g[3].Value)"
          if ($g[4].Success -and [int]$g[4].Value -gt 0) { $v += ".$($g[4].Value)" }   # 1.3.2.1: a small fix release
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          $exists = if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' }
          "exists=$exists" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v, release exists: $exists"
          exit 0   # "gh release view" failing just means "no release yet"

      - name: Build
        run: dotnet build src/TSLauncher.csproj -c Release -o out

      - name: Start-up check
        shell: pwsh
        run: |
          # Opens the real window (safe mode), builds every page and card type, then closes.
          # A layout or start-up error fails the build here instead of on someone's PC.
          $p = Start-Process out/TSLauncher.exe -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); Write-Host "::error::Start-up check timed out"; exit 1 }
          if (Test-Path out/selftest.txt) { Get-Content out/selftest.txt } else { Write-Host "no selftest.txt" }
          if ($p.ExitCode -ne 0) { Write-Host "::error::Start-up check failed (exit $($p.ExitCode))"; exit 1 }
          Remove-Item out/selftest.txt, out/logs, out/backups -Recurse -Force -ErrorAction SilentlyContinue

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/TSLauncher | Out-Null
          Copy-Item out/TSLauncher.exe dist/TSLauncher/
          Copy-Item README.md, LICENSE, CHANGELOG.md dist/TSLauncher/
          Compress-Archive -Path dist/TSLauncher -DestinationPath dist/TSLauncher.zip -Force

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          # The section of CHANGELOG.md for this version: from its "## x.y.z" heading to the next "## " heading.
          $v = "${{ steps.ver.outputs.version }}"
          $short = $v -replace '\.0$', ''          # "1.0.0" is written "1.0" in the changelog
          $lines = Get-Content CHANGELOG.md -Encoding UTF8
          $out = New-Object System.Collections.Generic.List[string]
          $in = $false
          foreach ($l in $lines) {
            if ($l -match '^## +(\S+)') {
              if ($in) { break }
              $in = ($Matches[1] -eq $v -or $Matches[1] -eq $short)
              continue
            }
            if ($in) { $out.Add($l) }
          }
          $body = ($out -join "`n").Trim()
          if (-not $body) { $body = "See [CHANGELOG.md](CHANGELOG.md)." ; Write-Host "::warning::No CHANGELOG.md section for $v" }
          # plain text on purpose: older launchers show these notes as-is in a Windows message box
          $body += "`n`nInstall: download TSLauncher.zip below and put TSLauncher.exe where the old one was. If you already have TS Launcher 1.1.0 or newer, it offers this update by itself."
          Set-Content -Path release-notes.md -Value $body -Encoding UTF8
          Write-Host "---- release notes ----"; Write-Host $body

      - uses: actions/upload-artifact@v4
        with:
          name: TSLauncher
          path: dist/TSLauncher.zip

      - name: Publish release (new version on main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: TS Launcher ${{ steps.ver.outputs.version }}
          files: dist/TSLauncher.zip
          body_path: release-notes.md

      - name: Publish release (pushed tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TSLauncher.zip
          body_path: release-notes.md
