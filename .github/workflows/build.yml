name: Build

# Every push and pull request is compiled on Windows.
# Pushing a tag like v1.0.1 also publishes a GitHub release with the zip attached.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build src/TSLauncher.csproj -c Release -o out

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/TSLauncher | Out-Null
          Copy-Item out/TSLauncher.exe dist/TSLauncher/
          Copy-Item README.md, LICENSE, CHANGELOG.md dist/TSLauncher/
          Compress-Archive -Path dist/TSLauncher -DestinationPath dist/TSLauncher.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: TSLauncher
          path: dist/TSLauncher.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TSLauncher.zip
          generate_release_notes: true
