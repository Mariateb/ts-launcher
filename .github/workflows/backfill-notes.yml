name: Fill in release notes (one-off)

# Sets the notes of the existing releases from CHANGELOG.md. Runs once, then this file is deleted.
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/backfill-notes.yml' ]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Update release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($v in '1.0.0', '1.1.0', '1.2.0', '1.2.1', '1.3.0') {
            $short = $v -replace '\.0$', ''
            $out = New-Object System.Collections.Generic.List[string]
            $in = $false
            foreach ($l in (Get-Content CHANGELOG.md -Encoding UTF8)) {
              if ($l -match '^## +(\S+)') { if ($in) { break }; $in = ($Matches[1] -eq $v -or $Matches[1] -eq $short); continue }
              if ($in) { $out.Add($l) }
            }
            $body = ($out -join "`n").Trim()
            if (-not $body) { Write-Host "::warning::No CHANGELOG.md section for $v"; continue }
            $body += "`n`n**Install:** download TSLauncher.zip below and put TSLauncher.exe where the old one was. If you already have TS Launcher 1.1.0 or newer, it offers this update by itself."
            Set-Content -Path notes.md -Value $body -Encoding UTF8
            gh release edit "v$v" --repo "${{ github.repository }}" --notes-file notes.md
            if ($LASTEXITCODE -ne 0) { throw "Could not update v$v" }
            Write-Host "v$v updated"
          }
